[project]
name = "tokenization-infra"
version = "0.1.0"
description = "AWS CDK (Python) infrastructure for the real estate tokenization MVP"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.277.0",
    "cdk-nag==3.0.2",
    "constructs>=10,<11",
    "pydantic>=2,<3",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenization_infra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".kiro", ".devbox", "node_modules", "cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "app.py", "bootstrap_app.py"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
